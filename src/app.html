<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#18181b" />
		<!-- Light or dark before the first render, as src/lib/theme.svelte.ts keeps
		     it afterwards: the stored choice, else the system's setting. -->
		<script>
			(() => {
				let theme = null;
				try {
					theme = localStorage.getItem('theme');
				} catch {}
				if (theme !== 'light' && theme !== 'dark')
					theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
				document.documentElement.dataset.theme = theme;
				if (theme === 'light')
					document.querySelector('meta[name="theme-color"]').setAttribute('content', '#d8d0c5');
			})();
		</script>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Warband Deck" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
